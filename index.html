<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم غيوم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0a0f26;--bg2:#141a45;--gold:#f0b35c;--gold2:#f7d094;--ivory:#e9ebf8;--mute:#aab0d6;--line:rgba(160,170,240,.28);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ivory);font:16px/1.7 Cairo,Tahoma,sans-serif;padding:16px}
.w{max-width:820px;margin:0 auto}
h1,h2{color:var(--gold2);margin:0 0 12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ivory);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
button{font:600 1rem Cairo,sans-serif;border-radius:999px;border:1.5px solid var(--gold);padding:10px 22px;cursor:pointer;min-height:44px;background:transparent;color:var(--gold2)}
button.g{background:var(--gold);color:#1a1405}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.tabs button{white-space:nowrap}.tabs button[aria-pressed=true]{background:var(--gold);color:#1a1405}
.note{color:var(--mute);font-size:.9rem}
#msg{min-height:1.6em;margin:8px 0;color:var(--gold2)}
.th{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.th div{position:relative;width:90px;height:90px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.th b{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1405;text-align:center;line-height:26px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.r2{grid-template-columns:1fr}}
</style>
</head>
<body><div class="w">

<div id="login" class="card" style="max-width:420px;margin:40px auto">
  <h1>لوحة تحكم غيوم</h1>
  <div id="urlBox" hidden><label for="api">رابط Apps Script (ينتهي بـ /exec)</label><input id="api" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="g" id="go">دخول</button></p>
  <div id="lmsg" class="note" role="alert"></div>
  <p class="note"><a href="#" id="chg" style="color:var(--gold2)">تغيير رابط Apps Script</a></p>
</div>

<div id="app" hidden>
  <div class="row"><h1 style="flex:3">لوحة تحكم غيوم</h1><button id="out" style="flex:1">خروج</button></div>
  <div class="tabs" id="tabs">
    <button data-t="orders">الطلبات</button><button data-t="product">المنتج والصور</button><button data-t="contact">التواصل</button><button data-t="faq">الأسئلة</button><button data-t="reviews">الآراء</button>
  </div>
  <div id="msg" role="status"></div>
  <div id="body"></div>
</div>

</div>
<script>
let API = "";   // يمكنك لصق رابط Apps Script هنا، أو تتركه فارغاً فتُسأل عنه عند أول دخول
try { API = API || localStorage.getItem('ghiom_api') || ''; } catch (_) {}
let PW = '', CFG = {}, ORDERS = [], tab = 'orders';
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = ['جديد', 'قيد التجهيز', 'تم الشحن', 'مكتمل', 'ملغي'];
const msg = (t) => { $('#msg').textContent = t || ''; };

async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, pw: PW, ...data }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'fail');
  return j;
}
async function loadCfg() {
  const r = await fetch(API); CFG = await r.json();
  CFG.product = CFG.product || {};
}

if (!API) $('#urlBox').hidden = false;
$('#chg').onclick = e => { e.preventDefault(); try { localStorage.removeItem('ghiom_api'); } catch (_) {} API = ''; $('#urlBox').hidden = false; $('#api').focus(); };
$('#go').onclick = async () => {
  const lm = $('#lmsg'); lm.textContent = '';
  if (!API) { const v = $('#api').value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) { lm.textContent = 'أدخل رابط Apps Script الصحيح.'; return; } API = v; try { localStorage.setItem('ghiom_api', v); } catch (_) {} }
  PW = $('#pw').value;
  if (!PW) { lm.textContent = 'أدخل كلمة السر.'; return; }
  try {
    lm.textContent = 'جارٍ التحقق...';
    const j = await api('orders'); ORDERS = j.orders; await loadCfg();
    $('#login').hidden = true; $('#app').hidden = false; show('orders');
  } catch (e) {
    lm.textContent = e.message === 'auth' ? 'كلمة السر خاطئة، أو لم تُضبط في Apps Script.' : 'تعذّر الاتصال (' + e.message + '). تأكد من الرابط وأن النشر Anyone وأنك أنشأت نسخة جديدة.';
  }
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#out').onclick = () => location.reload();
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.t); };

const F = (id, l, v, r) => `<label for="${id}">${l}</label>` + (r ? `<textarea id="${id}" rows="${r}">${esc(v)}</textarea>` : `<input id="${id}" value="${esc(v)}">`);
const SAVE = '<p><button class="g" id="save">حفظ</button></p>';
function show(t) {
  tab = t; msg('');
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  const P = CFG.product, B = $('#body');
  if (t === 'orders') {
    B.innerHTML = `<p class="note">${ORDERS.length} طلب. <button id="rf">تحديث</button></p>` + (ORDERS.length ? ORDERS.map(o => `<div class="card"><b>${esc(o.code)}</b> — ${esc(o.name)} — <a href="tel:${esc(o.phone)}" dir="ltr" style="color:var(--gold2)">${esc(o.phone)}</a><br>${esc(o.city)}، ${esc(o.address)}<br>${esc(o.product)}${o.qty ? ' × ' + esc(o.qty) : ''}${o.notes ? '<br>ملاحظات: ' + esc(o.notes) : ''}<br><span class="note">${o.time ? new Date(o.time).toLocaleString('ar') : ''}</span><select data-c="${esc(o.code)}" style="margin-top:8px">${ST.map(s => `<option${s === o.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>`).join('') : '<div class="card note">لا توجد طلبات بعد.</div>');
  }
  if (t === 'product') {
    B.innerHTML = '<div class="card">' + F('n', 'اسم المنتج', P.name || '') + F('d', 'الوصف', P.desc || '', 4) + `<div class="r2"><div>${F('p', 'السعر (مع العملة)', P.price || '')}</div><div>${F('o', 'السعر قبل الخصم', P.oldPrice || '')}</div></div>` + F('op', 'الخيارات: سطر لكل خيار، مثال: اللون: أخضر، أسود', (P.options || []).map(x => x.label + ': ' + x.values.join('، ')).join('\n'), 3) + '</div>' +
      `<div class="card"><b>صور المنتج</b><div class="th">${(P.images || []).map((u, i) => `<div><img src="${esc(u)}" alt=""><b data-r="${i}">×</b></div>`).join('')}</div><input type="file" id="up" accept="image/*"><p class="note">اختر صورة وتُرفع وتُحفظ مباشرة.</p>` +
      `<b>صورة الواجهة الرئيسية</b>${CFG.heroImage ? `<div class="th"><div><img src="${esc(CFG.heroImage)}" alt=""></div></div>` : ''}<input type="file" id="uh" accept="image/*"></div>` + SAVE;
  }
  if (t === 'contact') B.innerHTML = '<div class="card">' + F('w', 'رقم واتساب (دولي، أرقام فقط، مثال 2189XXXXXXXX)', CFG.whatsapp || '') + F('s', 'حسابات التواصل: سطر لكل حساب، مثال: انستغرام | https://...', (CFG.social || []).map(x => x.name + ' | ' + x.url).join('\n'), 4) + '</div>' + SAVE;
  if (t === 'faq') B.innerHTML = '<div class="card"><p class="note">اتركه فارغاً لاستخدام الأسئلة الافتراضية.</p>' + F('f', 'سطر لكل سؤال: السؤال | الجواب', (CFG.faq || []).map(q => q[0] + ' | ' + q[1]).join('\n'), 12) + '</div>' + SAVE;
  if (t === 'reviews') B.innerHTML = '<div class="card"><p class="note">أضف آراء عملاء حقيقيين فقط. السطر: الاسم | عدد النجوم | التعليق</p>' + F('r', '', (CFG.reviews || []).map(r => r.name + ' | ' + r.stars + ' | ' + r.text).join('\n'), 10) + '</div>' + SAVE;
}
const g = id => ($('#' + id) ? $('#' + id).value.trim() : '');
const lines = id => g(id).split('\n').map(x => x.trim()).filter(Boolean);

function productSettings() {
  const P = CFG.product;
  if ($('#n')) { P.name = g('n'); P.desc = g('d'); P.price = g('p'); P.oldPrice = g('o'); P.options = lines('op').map(l => { const a = l.split(':'); return { label: a[0].trim(), values: (a[1] || '').split(/[،,]/).map(x => x.trim()).filter(Boolean) }; }).filter(x => x.values.length); }
  return { 'الاسم': P.name || '', 'الوصف': P.desc || '', 'السعر': P.price || '', 'السعر قبل الخصم': P.oldPrice || '',
    'الخيارات': (P.options || []).map(x => x.label + ': ' + x.values.join('، ')).join('\n'),
    'الصور': (P.images || []).join('\n'), 'صورة الواجهة': CFG.heroImage || '' };
}
async function run(fn, ok) { try { msg('جارٍ الحفظ...'); await fn(); msg(ok || 'تم الحفظ. قد يلزم تحديث الموقع بضع ثوانٍ.'); } catch (e) { msg(e.message === 'auth' ? 'انتهت الجلسة، أعد الدخول.' : 'تعذّر الحفظ.'); } }

function shrink(file) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, 1400 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .85).split(',')[1]); };
    im.onerror = () => rej(new Error('bad')); im.src = u;
  });
}

$('#body').addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'rf') { await run(async () => { ORDERS = (await api('orders')).orders; show('orders'); }, 'تم التحديث.'); }
  if (t.dataset && t.dataset.r !== undefined) { productSettings(); CFG.product.images.splice(+t.dataset.r, 1); await run(async () => { await api('save', { settings: productSettings() }); show('product'); }); }
  if (t.id !== 'save') return;
  if (tab === 'product') await run(() => api('save', { settings: productSettings() }));
  if (tab === 'contact') { CFG.whatsapp = g('w').replace(/\D/g, ''); CFG.social = lines('s').map(l => { const a = l.split('|'); return { name: a[0].trim(), url: (a[1] || '').trim() }; }).filter(x => /^https?:\/\//.test(x.url)); await run(() => api('save', { settings: { 'واتساب': CFG.whatsapp, 'حسابات التواصل': CFG.social.map(x => x.name + ' | ' + x.url).join('\n') } })); }
  if (tab === 'faq') { const rows = lines('f').map(l => { const a = l.split('|'); return [a[0].trim(), a.slice(1).join('|').trim()]; }).filter(q => q[1]); CFG.faq = rows; await run(() => api('faq', { rows })); }
  if (tab === 'reviews') { const rows = lines('r').map(l => { const a = l.split('|'); return [a[0].trim(), String(Math.min(5, Math.max(1, parseInt(a[1]) || 5))), a.slice(2).join('|').trim()]; }).filter(r => r[2]); CFG.reviews = rows.map(r => ({ name: r[0], stars: +r[1], text: r[2] })); await run(() => api('reviews', { rows })); }
});
$('#body').addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.c) await run(() => api('status', { code: t.dataset.c, status: t.value }), 'تم تحديث الحالة.');
  if (t.id === 'up' || t.id === 'uh') {
    const f = t.files[0]; if (!f) return; productSettings();
    await run(async () => {
      msg('جارٍ رفع الصورة...');
      const r = await api('upload', { mime: 'image/jpeg', data: await shrink(f) });
      if (t.id === 'up') (CFG.product.images = CFG.product.images || []).push(r.url); else CFG.heroImage = r.url;
      await api('save', { settings: productSettings() }); show('product');
    }, 'تم رفع الصورة وحفظها.');
  }
});
</script>
</body>
</html>
